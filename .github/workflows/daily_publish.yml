name: Daily First Light AI Publish

on:
  schedule:
    # 16:25 KST (07:25 UTC) test publish slot.
    - cron: "25 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, Telegram/X 발행 안 함)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      source:
        description: '기사 입력 소스'
        required: false
        default: 'supabase'
        type: choice
        options:
          - supabase
          - file
      platform:
        description: '발행 플랫폼'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - telegram
          - x
      force:
        description: '강제 재발행'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: '발행 기사 수 제한 (0=무제한)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      USE_DB: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate articles
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/validate_articles.py

      - name: Sync generated articles to Supabase
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.source == 'supabase' || github.event.inputs.source == '') }}
        run: python scripts/sync_articles_to_supabase.py --input docs/articles.json

      - name: Run scheduled or manual publish
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            SOURCE=supabase
            PLATFORM=both
            DRY_RUN=false
            FORCE=false
            LIMIT=0
          else
            SOURCE="${{ github.event.inputs.source || 'supabase' }}"
            PLATFORM="${{ github.event.inputs.platform || 'both' }}"
            DRY_RUN="${{ github.event.inputs.dry_run || 'true' }}"
            FORCE="${{ github.event.inputs.force || 'false' }}"
            LIMIT="${{ github.event.inputs.limit || '0' }}"
          fi

          ARGS="--source $SOURCE --platform $PLATFORM"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python scripts/run_publish.py $ARGS
