name: X Trigger Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Account scope. Scheduled runs scan all configured accounts."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - core
          - fast
          - scoop
          - oss
          - coding
          - research
          - benchmark
          - all
      backfill:
        description: "Create review issues for the latest posts even without existing cursors"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_latest:
        description: "Create review issues from the fetched latest posts even if already seen"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Print candidates without creating issues or saving state"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_results:
        description: "Tweets to inspect per watched account"
        required: false
        default: "1"

permissions:
  contents: read
  issues: write

concurrency:
  group: x-trigger-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_DB: "true"
      SCHEDULED_SCOPE: all
      X_TRIGGER_PER_ACCOUNT_DELAY_SECONDS: "0.2"
      X_TRIGGER_FEED_TIMEOUT_SECONDS: "6"
      X_TRIGGER_FEED_RETRIES: "1"
      X_TRIGGER_FEED_BASE_URLS: ${{ vars.X_TRIGGER_FEED_BASE_URLS || 'https://rsshub.pseudoyu.com,https://rsshub.app,https://rsshub.rssforever.com,https://rss.detools.dev' }}
      X_TRIGGER_FEED_MODE: ${{ vars.X_TRIGGER_FEED_MODE || 'nitter-first' }}
      X_TRIGGER_NITTER_INSTANCES: ${{ vars.X_TRIGGER_NITTER_INSTANCES }}
      NITTER_INSTANCES: ${{ vars.NITTER_INSTANCES }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS_CJ }}
      TRIGGER_SUMMARY_MODEL: "gemini-3.1-flash-lite-preview"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TRIGGER_REVIEW_TELEGRAM_CHAT_ID: ${{ secrets.TRIGGER_REVIEW_TELEGRAM_CHAT_ID }}
      TRIGGER_AUTO_PUBLISH_SCORE_THRESHOLD: ${{ vars.TRIGGER_AUTO_PUBLISH_SCORE_THRESHOLD || '60' }}
      TRIGGER_REVIEW_SCORE_THRESHOLD: ${{ vars.TRIGGER_REVIEW_SCORE_THRESHOLD || '65' }}
      TRIGGER_MIN_ISSUE_SCORE: ${{ vars.TRIGGER_MIN_ISSUE_SCORE || '45' }}
      TRIGGER_AUTO_PUBLISH_PLATFORM: ${{ vars.TRIGGER_AUTO_PUBLISH_PLATFORM || 'both' }}
      TRIGGER_CREATE_LOW_SIGNAL_ISSUES: ${{ vars.TRIGGER_CREATE_LOW_SIGNAL_ISSUES || 'false' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_TWEET_URL: https://api.x.com/2/tweets
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan watched X accounts
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            SCOPE="$SCHEDULED_SCOPE"
            MAX_RESULTS=1
          else
            SCOPE="${{ github.event.inputs.scope || 'auto' }}"
            MAX_RESULTS="${{ github.event.inputs.max_results || '1' }}"
          fi
          ARGS="--accounts config/x_trigger_accounts.json --scope $SCOPE --max-results $MAX_RESULTS"
          if [ "${{ github.event.inputs.backfill || 'false' }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ github.event.inputs.force_latest || 'false' }}" = "true" ]; then ARGS="$ARGS --force-latest"; fi
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/x_trigger_scan.py $ARGS
