name: Manual Publish Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/manual-daily-publish-smoke.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-publish-smoke
  cancel-in-progress: false

jobs:
  publish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USE_DB: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_TWEET_URL: https://api.x.com/2/tweets
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish one Telegram article
        run: |
          python scripts/run_publish.py --source supabase --platform telegram --limit 1 --force --allow-partial ||
          python scripts/run_publish.py --source file --platform telegram --limit 1 --force --allow-partial

      - name: Publish one X summary optionally
        continue-on-error: true
        run: |
          python scripts/run_publish.py --source supabase --platform x --limit 1 --force --allow-partial ||
          python scripts/run_publish.py --source file --platform x --limit 1 --force --allow-partial
