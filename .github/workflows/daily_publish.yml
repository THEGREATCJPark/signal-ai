name: Daily AI Frontier News Publish

on:
  schedule:
    # 20:42 KST (11:42 UTC) temporary daily publish test slot.
    - cron: "42 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without Telegram/X publishing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      source:
        description: "Article input source"
        required: false
        default: "supabase"
        type: choice
        options:
          - supabase
          - file
      platform:
        description: "Publish platform"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - telegram
          - x
      force:
        description: "Publish even if state says already published"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "Maximum article count, 0 means unlimited"
        required: false
        default: "0"
      allow_partial:
        description: "Succeed when at least one target platform publishes"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: daily-ai-frontier-news-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      USE_DB: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_TWEET_URL: https://api.twitter.com/2/tweets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate articles
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/validate_articles.py

      - name: Sync generated articles to Supabase
        if: >-
          ${{
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
              (github.event.inputs.source == 'supabase' || github.event.inputs.source == ''))
          }}
        run: python scripts/sync_articles_to_supabase.py --input docs/articles.json

      - name: Run scheduled or manual publish
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            SOURCE=supabase
            PLATFORM=both
            DRY_RUN=false
            FORCE=true
            LIMIT=1
            ALLOW_PARTIAL=true
          else
            SOURCE="${{ github.event.inputs.source || 'supabase' }}"
            PLATFORM="${{ github.event.inputs.platform || 'both' }}"
            DRY_RUN="${{ github.event.inputs.dry_run || 'true' }}"
            FORCE="${{ github.event.inputs.force || 'false' }}"
            LIMIT="${{ github.event.inputs.limit || '0' }}"
            ALLOW_PARTIAL="${{ github.event.inputs.allow_partial || 'true' }}"
          fi

          ARGS="--source $SOURCE --platform $PLATFORM"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$ALLOW_PARTIAL" = "true" ]; then ARGS="$ARGS --allow-partial"; fi
          python scripts/run_publish.py $ARGS
